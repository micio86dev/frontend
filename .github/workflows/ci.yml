name: CI — frontend

# Every long-lived branch, not just develop. With develop alone, a release/**
# or hotfix/** branch reached main without this suite ever running — so the one
# merge that ships to production was the least tested one in the flow.
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']

jobs:
  ci:
    name: Lint, Test & E2E
    runs-on: ubuntu-latest
    # Pinned Playwright image: browsers + system deps preinstalled, and the
    # SAME rendering environment the committed screenshot baselines (-linux)
    # were generated in — keeps visual regression deterministic (100% green).
    container: mcr.microsoft.com/playwright:v1.61.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned Playwright image ships neither unzip nor bun, and setup-bun
      # downloads a .zip. Without this the next step fails with "Unable to
      # locate executable file: unzip" — which is the real reason this used to
      # be `npm install -g bun`.
      - name: Install unzip (absent from the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq unzip

      - name: Install Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The MediaPipe proctoring binaries are build artifacts, not source: they
      # are gitignored, so the checkout does not contain them. This step both
      # provisions them and VERIFIES them, and fails the job when any asset is
      # not a real binary.
      #
      # It must run before vitest: `tests/unit/proctor-assets.spec.ts` asserts
      # what the bytes ARE, not that a path resolves. Those content assertions
      # are the ones that would have caught the 2026-08-25 production defect,
      # where every existence check passed against a Git LFS pointer.
      - name: Provision and verify proctoring assets
        run: bun run proctor:assets

      # NON-BLOCKING, deliberately, dated, and NOT silenced.
      #
      # Every advisory here is a TRANSITIVE build-toolchain dependency with no
      # fix reachable from our pinned versions. Clearing the critical one
      # (@nuxt/devtools) needs Nuxt >= 4.5.1, which pulls Vite 8 / Rolldown and
      # breaks `nuxt generate` with two `builtin:vite-json` failures the bundler
      # never attributes to a module. `overrides` cannot help either: `nuxt` is
      # itself a flagged DIRECT dependency.
      #
      # `--ignore` was tried first and does NOT work on bun 1.3.14 — it neither
      # filters the listed ids from the report nor changes the exit code.
      # `continue-on-error` is therefore the mechanism, and it is the more
      # honest one: the full advisory list still prints on every run and the
      # step shows as failed-but-tolerated rather than quietly passing.
      #
      # REVIEW BY 2026-11-13 — re-run without this and delete it once upstream
      # ships fixes. A bypass nobody revisits stops being a decision and
      # becomes a blind spot.
      - name: Security audit
        run: bun audit
        continue-on-error: true
        # Exits non-zero on HIGH/CRITICAL vulnerabilities

      - name: Prettier format-check
        run: bun run format:check

      - name: TypeScript type-check
        run: bun run typecheck

      - name: Client drift check
        run: bun run codegen:check

      - name: Vitest unit tests + coverage
        run: node node_modules/.bin/vitest run --coverage --coverage.thresholds.lines=85

      - name: Playwright E2E (chromium + webkit + mobile, incl. visual regression)
        # webServer (playwright.config) builds + serves the SSR output; browsers
        # come from the container image (no `playwright install` needed).
        run: node node_modules/.bin/playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t beai-frontend:ci .

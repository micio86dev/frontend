name: CI — frontend

# Every long-lived branch, not just develop. With develop alone, a release/**
# or hotfix/** branch reached main without this suite ever running — so the one
# merge that ships to production was the least tested one in the flow.
on:
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']

jobs:
  ci:
    name: Lint, Test & E2E
    runs-on: ubuntu-latest
    # Pinned Playwright image: browsers + system deps preinstalled, and the
    # SAME rendering environment the committed screenshot baselines (-linux)
    # were generated in — keeps visual regression deterministic (100% green).
    container: mcr.microsoft.com/playwright:v1.61.1-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned Playwright image ships neither unzip nor bun, and setup-bun
      # downloads a .zip. Without this the next step fails with "Unable to
      # locate executable file: unzip" — which is the real reason this used to
      # be `npm install -g bun`.
      - name: Install unzip (absent from the Playwright image)
        run: apt-get update -qq && apt-get install -y -qq unzip

      - name: Install Bun 1.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit
        # Exits non-zero on HIGH/CRITICAL vulnerabilities

      - name: Prettier format-check
        run: bun run format:check

      - name: TypeScript type-check
        run: bun run typecheck

      - name: Client drift check
        run: bun run codegen:check

      - name: Vitest unit tests + coverage
        run: node node_modules/.bin/vitest run --coverage --coverage.thresholds.lines=85

      - name: Playwright E2E (chromium + webkit + mobile, incl. visual regression)
        # webServer (playwright.config) builds + serves the SSR output; browsers
        # come from the container image (no `playwright install` needed).
        run: node node_modules/.bin/playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t beai-frontend:ci .
